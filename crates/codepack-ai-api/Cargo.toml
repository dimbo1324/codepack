[package]
name = "codepack-ai-api"
# Inherited, like every other member. This manifest used to spell the version, the
# edition and the lints out, because an excluded package cannot inherit them and the
# duplication had to be kept honest by a test comparing the two numbers. Owner decision
# 2026-09-12 put the crate back in the workspace, so the duplication — and the test that
# guarded it — are gone.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Stage S13's API path: the HTTP client and the OS credential store."

[dependencies]
codepack-ai = { workspace = true }
# Only the API path estimates a request's size.
codepack-tokens = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The two dependencies that make this crate invariant I1's one named exception. Both are
# declared in the root manifest, where the reasoning for each lives beside every other
# dependency decision.
ureq = { workspace = true }
keyring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# For one test only: that this crate's provider list and `Config`'s valid-value set name
# the same providers. The crate itself needs nothing from core — `ask` takes every
# decision as an argument — so this stays a dev-dependency rather than becoming a real
# one for the sake of a guard.
codepack-core = { workspace = true }

[lints]
workspace = true
