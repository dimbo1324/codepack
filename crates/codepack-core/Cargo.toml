[package]
name = "codepack-core"
description = "Domain types, configuration, errors, progress, and cancellation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# S11: `.codepack.toml` moved here from `codepack-cli` when the desktop shell became a
# second reader of it. A per-project format read by two front ends is a contract, and
# two copies of the field list would silently disagree.
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
# `.codepack-allow` fingerprints. A cryptographic hash rather than a cheap one because a
# collision does not produce a wrong number on a screen — it silently withholds a real
# secret finding. Already a workspace dependency (`codepack-diff` hashes snapshots).
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
