[package]
name = "codepack-sanitize"
description = "Sterile copy: comment stripping (tree-sitter) and PATH-formatter reformatting into a separate destination folder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
codepack-core.workspace = true
codepack-scanner.workspace = true
codepack-security.workspace = true
# The optional `.7z` output (owner request 2026-07-29). Archiving lives in
# codepack-archive so the sterile copy does not become a second place that knows how to
# write archives; the dependency points downward, as the domain rules require.
codepack-archive.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon.workspace = true
tree-sitter.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-java.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-php.workspace = true
tree-sitter-ruby.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-make.workspace = true
tree-sitter-kotlin-ng.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Reading a produced `.7z` back to prove the sterile copy and its report are really in
# it. Test-only: the crate itself never opens an archive, it only asks
# codepack-archive to write one.
sevenz-rust2.workspace = true

[lints]
workspace = true
