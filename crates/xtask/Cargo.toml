[package]
name = "xtask"
description = "Task runner and quality gate for the codepack workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# Near enough to dependency-free: the gate must run instantly and without network access.
# `sha2` is the one exception, for `package`'s SHA256SUMS.txt. It is already in this
# workspace's lock file and its build tree, so it costs the gate nothing — and the
# alternative, a hand-written hash inside the tool that tells users a download is
# authentic, is not a trade worth making.
[dependencies]
sha2.workspace = true
# Audit No. 5: the isolation check parses manifests properly now. A hand-rolled line
# reader was what let `[dependencies.reqwest]` past it.
toml.workspace = true
# `codepack-core::time` for one thing only: comparing an ignored-advisory's revisit date
# against today (audit 2026-09-07, S-3). A workspace path dependency, already built by
# `cargo build --workspace`, costs this crate nothing that duplicating the calendar
# arithmetic by hand would not also cost in a second, divergent copy of it — precisely
# the reason `time.rs` exists at all (see its own module doc).
codepack-core = { path = "../codepack-core" }

# Test-only: the checksum writer's tests need a throwaway bundle directory.
[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
