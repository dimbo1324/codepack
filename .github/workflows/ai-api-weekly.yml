name: ai-api (weekly)

# Audit 2026-09-07, S-12: `codepack-ai-api` is deliberately excluded from the workspace
# (owner decision 2026-09-06, Q41) so `keyring` and `ureq` never reach a product binary
# or `cargo deny`'s graph — but that exclusion also means `cargo xtask gate` never
# compiles it, so it can rot silently. This job is the insurance: a weekly build catches
# that within a week instead of the six months it would otherwise take for "finish S13"
# to mean "fix eight hundred lines that stopped compiling" instead of "write the
# interface". It never runs on a push, so it costs no one a slower gate.
on:
  schedule:
    # 06:00 UTC every Monday — an arbitrary but fixed slot, away from the push traffic
    # the main `ci.yml` legs see.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-api:
    name: cargo xtask ai-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # `codepack-ai-api` pulls `native-tls` (openssl-sys on Linux) for `ureq` and
      # `keyring`'s Secret Service backend is pure-Rust (`zbus`), so this needs no
      # D-Bus package the way the desktop build does — just OpenSSL's headers.
      - name: Install OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo xtask ai-api
        run: cargo xtask ai-api
