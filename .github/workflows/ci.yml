name: CI

on:
  push:
    # Every branch, not just main. Until 2026-07-25 a topic branch got no CI at all,
    # so work was only ever verified after it had already been merged. The
    # concurrency group below keys on the ref, so pushing repeatedly to one branch
    # cancels its own superseded runs instead of queueing them.
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo xtask gate
        run: cargo xtask gate
