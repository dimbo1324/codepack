name: CI

on:
  push:
    # Every branch, not just main. Until 2026-07-25 a topic branch got no CI at all,
    # so work was only ever verified after it had already been merged. The
    # concurrency group below keys on the ref, so pushing repeatedly to one branch
    # cancels its own superseded runs instead of queueing them.
    branches: ["**"]
  pull_request:

# Neither job here needs more than reading the checked-out code (audit 2026-09-07,
# C-2): no job creates a release, publishes a package, or uploads a security report.
# Without this, actions/checkout's default token carries write access every step
# inherits, whether it needs it or not.
permissions:
  contents: read

concurrency:
  # `head_ref` is set only for pull_request, `ref` only otherwise, so a branch and its
  # open PR share one group. Without this, enabling push on every branch would run the
  # whole matrix twice for every push to a branch that has a PR open.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # All three again, as of the owner decision 2026-09-06: the product is used by a
        # team on different machines, which reverses the 2026-07-26 narrowing to Windows.
        # Q21 — the Unix `gate` failure that was never root-caused — is what this matrix
        # exists to answer: `fail-fast: false` above means a failure on one OS still
        # reports the other two, so the first green Windows leg does not hide anything.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # `codepack-desktop` is a normal cargo workspace member (BLUEPRINT §C.2), so
      # `cargo clippy --workspace`/`cargo test --workspace` build it on every OS, not just
      # when packaging. Tauri's Linux backend links against these system libraries via
      # pkg-config; without them the workspace fails to compile before `cargo xtask gate`
      # even reaches the deny check. Windows (WebView2) and macOS (Xcode Command Line
      # Tools, preinstalled on the runner image) need nothing extra.
      #
      # `libdbus-1-dev` is kept although the crate that most obviously wanted it —
      # `keyring`, via Secret Service — left the workspace with Q41. GTK pulls D-Bus in
      # regardless, and dropping a package from this list on the strength of an untested
      # guess is how a green build becomes a red one on somebody else's machine.
      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      # `cargo xtask gate` runs the frontend format/typecheck/lint checks only when the
      # pnpm toolchain is present, and skips with a notice otherwise. Without these three
      # steps that skip is what CI did — the checks existed and never ran anywhere except a
      # developer's machine. `xtask` now also hard-fails instead of skipping when `CI` is
      # set, so deleting these steps breaks the build loudly rather than silently.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # The gate's `dev scripts` step runs the scripts/ test suite, which guards
      # clean-project's protected-path logic. It fails rather than skips when CI is set,
      # so the interpreter is pinned here instead of relying on whatever the runner image
      # happens to ship -- the same reasoning as the pnpm steps above.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: cargo xtask gate
        run: cargo xtask gate

      # Stage S10's own acceptance criterion, whole again: with the matrix restored
      # (owner decision 2026-09-06) this proves headless export on all three platforms,
      # which is what S10 asked for. The test suite exercises the binary too, but this
      # runs it the way a user's pipeline would -- a release build, on a real checkout,
      # driving the whole eight-step pipeline end to end.
      - name: Headless export (S10 acceptance)
        shell: bash
        run: |
          set -uo pipefail
          cargo build --release -p codepack-cli || exit 1
          mkdir -p "$RUNNER_TEMP/bundle"

          # `|| exported=$?` rather than a bare call followed by `$?`: the shell
          # GitHub runs this with has `errexit` on, so an unguarded non-zero exit would
          # abort the step before the code below ever got to look at it -- which is
          # exactly what happens on 3, the case this step exists to tolerate.
          exported=0
          ./target/release/codepack export . --out "$RUNNER_TEMP/bundle" --safe-mode safe --json > "$RUNNER_TEMP/export.json" || exported=$?

          # 0 and 3 both mean the export itself worked; 3 additionally reports that the
          # bundle contains critical findings. This repository trips that on purpose --
          # codepack-security's own fixtures are credential-shaped, which is the point
          # of them -- so treating 3 as failure here would make the acceptance step fail
          # for a reason that has nothing to do with whether headless export works.
          if [ "$exported" -ne 0 ] && [ "$exported" -ne 3 ]; then
            echo "headless export failed with exit $exported" >&2
            cat "$RUNNER_TEMP/export.json" >&2 || true
            exit 1
          fi

          python3 tests/ci/check_export_report.py "$RUNNER_TEMP/export.json"

      # The scanner's exit code is what a pipeline gates on, so verify the contract
      # rather than assume it.
      - name: Exit code contract (S10 acceptance)
        shell: bash
        run: |
          set -uo pipefail
          fixture="$RUNNER_TEMP/secret-fixture"
          mkdir -p "$fixture"
          printf 'print(1)\n' > "$fixture/main.py"
          printf 'API_KEY=%s\n' 'totally-fake-value-0001' > "$fixture/.env"

          found=0
          ./target/release/codepack scan "$fixture" > /dev/null 2>&1 || found=$?
          if [ "$found" -ne 3 ]; then
            echo "expected exit 3 for a project carrying a credential, got $found" >&2
            exit 1
          fi

          missing=0
          ./target/release/codepack scan "$RUNNER_TEMP/definitely-absent" > /dev/null 2>&1 || missing=$?
          if [ "$missing" -ne 1 ]; then
            echo "expected exit 1 for a missing project, got $missing" >&2
            exit 1
          fi
          echo "exit code contract ok: 3 for findings, 1 for failure"

  # Packaging is the one thing the gate cannot check: `cargo xtask gate` compiles and
  # tests the workspace, and a bundler config can be wrong in every way while all of that
  # stays green. The Windows installer at least gets built by hand before a release; the
  # Linux packages were introduced on a Windows machine with no way to run them, so this
  # job is the only thing standing between "the config looks right" and "it works".
  #
  # Separate from `gate` rather than a step inside it: it needs a release build of the
  # whole desktop app, which would roughly double the gate's wall clock on every push for
  # a check that only has to hold when packaging changes.
  package-linux:
    name: package (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo xtask package
        run: cargo xtask package

      # What the config claims, checked against what the bundler actually wrote. Reading
      # the .deb's control file and file list is the difference between "the JSON parsed"
      # and "the package declares its webview dependency and installs a desktop entry".
      - name: Inspect the .deb
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls target/release/bundle/deb/*.deb)
          echo "== control =="
          dpkg-deb --field "$deb"
          echo "== contents =="
          dpkg-deb --contents "$deb"

          # Read each stream once into a variable and match against that, rather than
          # piping into `grep -q`: `-q` exits on the first match, closing its end of the
          # pipe, and dpkg-deb (tar underneath) can get SIGPIPE/EPIPE on its next write
          # and return non-zero — which `pipefail` then reports as *this check* failing,
          # even though the dependency or entry it was looking for is right there (audit
          # 2026-09-07, C-1, run #109). `case` also has no need for `grep`'s regex
          # escaping, the way the icon check below already avoids it for `128x128` being
          # a prefix of `128x128@2x`.
          fail=0
          depends="$(dpkg-deb --field "$deb" Depends)"
          contents="$(dpkg-deb --contents "$deb")"
          for dependency in libwebkit2gtk-4.1-0 libgtk-3-0 xdg-utils; do
            case "$depends" in
              *"$dependency"*) ;;
              *)
                echo "::error title=deb::Depends is missing $dependency" >&2
                fail=1
                ;;
            esac
          done
          case "$contents" in
            *applications/*.desktop*) ;;
            *)
              echo "::error title=deb::no desktop entry in the package" >&2
              fail=1
              ;;
          esac
          # Audit 2026-09-07, L-1/L-10: this is the one place that can tell "the CLI was
          # never bundled" apart from "the CLI was bundled and I forgot to check for it"
          # — README's whole Quick start is CLI commands, and a package without
          # `usr/bin/codepack` makes every one of them `command not found`.
          case "$contents" in
            *usr/bin/codepack*) ;;
            *)
              echo "::error title=deb::usr/bin/codepack is missing from the package" >&2
              fail=1
              ;;
          esac
          case "$contents" in
            *usr/share/bash-completion/completions/codepack*) ;;
            *)
              echo "::error title=deb::no shell completion file in the package" >&2
              fail=1
              ;;
          esac
          # `128x128@2x.png` installs into a `128x128@2x` directory, not `256x256`:
          # hicolor names a scaled directory after its base size, and Tauri follows that.
          # So the sizes asserted here are the ones with a plainly named source file.
          # Membership in a space-separated list rather than a regex, because `128x128`
          # is a prefix of `128x128@2x` and a careless pattern would accept the wrong one.
          icons=$(printf '%s\n' "$contents" | grep -o 'icons/hicolor/[^/]*' | sort -u | xargs)
          for size in 128x128 512x512; do
            case " $icons " in
              *" icons/hicolor/$size "*) ;;
              *)
                echo "::error title=deb::no $size icon in the package; it installs: $icons" >&2
                fail=1
                ;;
            esac
          done
          exit $fail

      - name: Verify the checksums
        shell: bash
        run: |
          set -euo pipefail
          for dir in target/release/bundle/*/; do
            if [ -f "$dir/SHA256SUMS.txt" ]; then
              (cd "$dir" && sha256sum -c SHA256SUMS.txt)
            fi
          done

      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*/SHA256SUMS.txt
          if-no-files-found: error

  # Audit 2026-09-07, C-4/L-13/T-9: `package-linux` proves the packages build and that
  # `.deb` declares the dependencies and files it should. Nobody checked what happens
  # after `apt-get install` — which is exactly why L-1 (no CLI in the package) went
  # unnoticed until this pass. No checkout here on purpose: everything this job needs is
  # the downloaded package plus a fixture built inline, which sidesteps needing git (and
  # therefore an extra Node bootstrap for `actions/checkout`) inside a bare distribution
  # image.
  install-and-run-linux:
    name: install & run (${{ matrix.image }})
    needs: package-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "ubuntu:24.04"
            pkg_manager: apt
            package_glob: "target/release/bundle/deb/*.deb"
          - image: "debian:12"
            pkg_manager: apt
            package_glob: "target/release/bundle/deb/*.deb"
          - image: "fedora:41"
            pkg_manager: dnf
            package_glob: "target/release/bundle/rpm/*.rpm"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages

      - name: Install the package (apt)
        if: matrix.pkg_manager == 'apt'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          # xvfb and dbus (dbus-run-session) plus dbus-x11 (dbus-launch and the rest of
          # the X11 integration) are for the GUI-startup check below, not for installing
          # the package itself — apt resolves codepack's own runtime dependencies
          # (webkit2gtk, gtk3, appindicator, librsvg2, xdg-utils) from its `Depends`
          # field, which is the whole point of installing through the package manager
          # rather than copying the binary out by hand.
          apt-get install -y --no-install-recommends xvfb dbus dbus-x11
          apt-get install -y ./${{ matrix.package_glob }}

      - name: Install the package (dnf)
        if: matrix.pkg_manager == 'dnf'
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y xorg-x11-server-Xvfb dbus dbus-x11
          dnf install -y ./${{ matrix.package_glob }}

      - name: Headless export with the installed CLI
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/fixture/src
          printf 'fn main() { println!("hi"); }\n' > /tmp/fixture/src/main.rs
          printf '# fixture\n' > /tmp/fixture/README.md
          printf 'API_KEY=totally-fake-not-a-real-secret\n' > /tmp/fixture/.env

          # `|| exported=$?` rather than a bare call: errexit would otherwise abort this
          # step before the code below can tell exit 3 (critical findings — the `.env`
          # above is planted on purpose) apart from a real failure.
          exported=0
          codepack export /tmp/fixture --out /tmp/bundle --safe-mode safe --json \
            > /tmp/export.json || exported=$?
          if [ "$exported" -ne 0 ] && [ "$exported" -ne 3 ]; then
            echo "::error title=install-and-run::headless export failed with exit $exported" >&2
            cat /tmp/export.json >&2 || true
            exit 1
          fi

          # A light check, not `tests/ci/check_export_report.py`'s full one: this job
          # has no checkout, so it has no copy of that script, and reaching for one
          # here would mean either fetching it over the network mid-job or duplicating
          # its logic — the `gate` job's native-OS legs already run the thorough
          # version of this check on every push. What this job answers is narrower and
          # does not need it: did the *installed* binary run at all.
          report="$(cat /tmp/export.json)"
          case "$report" in
            *'"successful": true'*) ;;
            *)
              echo "::error title=install-and-run::export report does not say successful: true" >&2
              echo "$report" >&2
              exit 1
              ;;
          esac
          result_path=$(printf '%s\n' "$report" | grep -o '"result_path": "[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$result_path" ] || [ ! -f "$result_path" ]; then
            echo "::error title=install-and-run::result_path missing or does not exist: $result_path" >&2
            exit 1
          fi
          echo "headless export via the installed package produced: $result_path"

      # Rough on purpose (audit's own words): this tells "does not start at all" apart
      # from everything else, which is what caught L-5 (a failed tray aborting startup)
      # and is meant to surface L-7 (DMABUF under a software renderer) if it reproduces
      # here. `continue-on-error`: a runner's GPU/Xvfb interaction is exactly the kind
      # of environment-specific failure this step exists to observe, not something this
      # job can fix from here, and it must not block the export check above — which is
      # the one this job actually exists to guarantee — from reporting green.
      - name: GUI starts under Xvfb
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          Xvfb :99 -screen 0 1024x768x24 &
          xvfb_pid=$!
          export DISPLAY=:99
          dbus-run-session -- codepack-desktop &
          app_pid=$!
          sleep 5
          if kill -0 "$app_pid" 2>/dev/null; then
            echo "codepack-desktop is still running after 5s under Xvfb"
            status=0
          else
            echo "::warning title=install-and-run::codepack-desktop exited within 5s under Xvfb (L-5/L-7?)"
            status=1
          fi
          kill "$app_pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          exit $status
