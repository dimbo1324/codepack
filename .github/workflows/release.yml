name: Release

# Audit 2026-09-07, C-7/S-6: until now a release meant a manual build on someone's
# machine, and its reproducibility was the reproducibility of that machine. This job is
# where the installers get built and published instead — the same `cargo xtask package`
# the gate's own installer-artifact check already verifies, run by the same CI that
# already proves the workspace builds and tests clean, not assembled by hand.
#
# `actions/attest-build-provenance` (S-6, step 1 of its own ordered plan — the one that
# costs no money and needs no owner-held key) gives each published file a SLSA
# attestation: cryptographic proof that this exact artifact was built by this exact
# workflow from this exact commit. A SHA256SUMS.txt beside a file proves it arrived
# intact; it says nothing about who produced it. GPG-signed Linux packages and a paid
# Windows code-signing certificate remain open questions for the owner (Q48) — this
# covers the step that needs neither.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo xtask package
        run: cargo xtask package

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  build-linux:
    name: build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # 2026-09-08: see the identical step in package-linux.yml for the full story — a
      # `codepack` built natively here (Ubuntu 24.04, glibc 2.39) refuses to start at
      # all on Debian 12 (glibc 2.36) with `version 'GLIBC_2.39' not found`, confirmed
      # by hand against real containers. This job publishes the file a real user
      # downloads, so it needs the fix even more than the CI-only validation job does.
      # See package-linux.yml's identical steps for why this is a persistent container
      # plus one step per phase rather than one long inline `bash -c`: a monolithic
      # step's failure annotation names no phase at all, which cost a whole CI round
      # trip to diagnose there.
      - name: Start a debian:12 container for an older-glibc build of codepack-cli
        run: docker run -d --name codepack-cli-glibc-baseline -v "$PWD:/repo" -w /repo debian:12 sleep 1800

      - name: "debian:12 build: install system packages"
        run: |
          docker exec codepack-cli-glibc-baseline bash -c "
            set -euo pipefail
            apt-get -o Acquire::Retries=5 update -qq
            apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends ca-certificates curl gcc libc6-dev
          "

      - name: "debian:12 build: install the pinned Rust toolchain"
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          docker exec codepack-cli-glibc-baseline bash -c "
            set -euo pipefail
            curl --proto '=https' --tlsv1.2 --retry 5 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain '$toolchain' --profile minimal -q
          "

      - name: "debian:12 build: install cargo-auditable"
        run: docker exec codepack-cli-glibc-baseline bash -c '. "$HOME/.cargo/env" && cargo install cargo-auditable --locked -q'

      # `CARGO_TARGET_DIR=/build`, not the bind-mounted `/repo/target`: see
      # package-linux.yml's identical step for why — a from-scratch release build of
      # codepack-cli's own dependency graph alone measured over 2 GiB, verified by
      # hand, and this workspace's native Tauri build needs much of the same graph
      # again from a different toolchain path. `/build` disappears with the container
      # instead of eating into the runner's limited disk before the native build even
      # starts; only the finished binary crosses back out, via `docker cp`.
      - name: "debian:12 build: cargo auditable build codepack-cli"
        run: docker exec -e CARGO_TARGET_DIR=/build codepack-cli-glibc-baseline bash -c '. "$HOME/.cargo/env" && cargo auditable build --release -p codepack-cli'

      - name: Copy the built CLI out of the container
        run: |
          mkdir -p target/release
          docker cp codepack-cli-glibc-baseline:/build/release/codepack target/release/codepack

      - name: Stop the debian:12 build container
        if: always()
        run: docker rm -f codepack-cli-glibc-baseline

      - name: Verify the CLI needs no newer glibc than debian:12 provides
        run: docker run --rm -v "$PWD:/repo" -w /repo debian:12 ./target/release/codepack --version

      - name: cargo xtask package
        env:
          CODEPACK_CLI_PREBUILT: "1"
        run: cargo xtask package

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and upload its assets
      attestations: write # to attest-build-provenance
      id-token: write # attest-build-provenance signs with a short-lived OIDC token
    steps:
      # No `merge-multiple` on purpose: `xtask package` writes one SHA256SUMS.txt per
      # bundle *format* directory (nsis, deb, rpm, appimage), so this run alone produces
      # four files with that exact name. Keeping each artifact's own subdirectory here
      # avoids one silently overwriting another before the flattening step below even
      # runs.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      # GitHub Releases assets are flat — no subdirectories — so every file uploaded to
      # one has to have a name unique across the whole release. Every installer's own
      # filename already is (it carries the version and, for Linux, the format); the
      # four SHA256SUMS.txt files are the one collision, resolved by prefixing each
      # with the bundle format directory it came from.
      - name: Flatten into uniquely-named release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [ "$base" = "SHA256SUMS.txt" ]; then
              format="$(basename "$(dirname "$file")")"
              cp "$file" "release-assets/SHA256SUMS-${format}.txt"
            else
              cp "$file" "release-assets/$base"
            fi
          done < <(find dist -type f -print0)
          echo "Publishing:"
          ls -la release-assets

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: "release-assets/*"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
