# cargo-deny configuration. Wired into `cargo xtask gate` and CI from stage S1 onward,
# now that the workspace has real dependencies.

[advisories]
yanked = "deny"
# All 16 entries below are transitive dependencies of the S11 Tauri desktop shell,
# none a direct dependency of our own code, and none has a safe upgrade available
# per the advisories themselves. Owner decision 2026-07-25, see
# docs/__arch__/open-questions.md. Revisit each group if its upstream root moves.
ignore = [
    # unic-* (open-i18n/rust-unic, archived) -- via urlpattern -> tauri-utils -> tauri
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident

    # gtk-rs GTK3 bindings (unmaintained; GTK4 bindings exist but Tauri's tray
    # crates haven't migrated) -- via tray-icon/muda -> tauri, the Linux tray backend
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys

    # pulled in by glib-macros, part of the same GTK3 stack above
    "RUSTSEC-2024-0370", # proc-macro-error
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own workspace crates (e.g. codepack-scanner ->
# codepack-core, S2 onward) have no semver range by design — they are pinned to the
# exact local commit already. Without this, cargo-deny flags every in-workspace path
# dependency as a "wildcard", which is a false positive for internal, unpublished
# crates, not a real supply-chain risk.
allow-wildcard-paths = true

[licenses]
# Permissive licenses only. A copyleft dependency needs an explicit owner decision
# recorded in docs/__arch__/open-questions.md.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Our own workspace crates (all `publish = false`, never shipped to crates.io) don't
# carry a `license` field yet — that is a separate, unrelated decision. Don't fail the
# license check on our own unpublished code.
[licenses.private]
ignore = true

# Copyleft dependencies pulled in transitively by the S11 desktop shell (wry's
# CSS engine, and the `notify` watch-mode crate) — none is a direct dependency of
# our own code. Owner decision 2026-07-25, see docs/__arch__/open-questions.md.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cssparser"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "cssparser-macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "dtoa-short"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "option-ext"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "selectors"

[[licenses.exceptions]]
allow = ["CC0-1.0"]
name = "notify"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
