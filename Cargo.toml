[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/dimbo1324/codepack"
publish = false

# Shared dependency versions. Crates opt in with `dep.workspace = true`.
# Every dependency here must be justified by the stage that needs it (see the
# `**Status.**` line under that stage in ROADMAP.md for the justification).
[workspace.dependencies]
# S1 (codepack-core): Config and domain types need JSON round-trip and, later,
# consumption by codepack-reports/-storage/the UI without re-deriving.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# S1: mandated by .ai/project/12-domain-rules.md for library error types.
thiserror = "2.0"
# S1: progress/log channel abstraction, reused unchanged by the S9 engine.
crossbeam-channel = "0.5"
# S1 (dev-dependency only): hermetic config load/save tests that never touch the
# developer's real OS config directory.
tempfile = "3.27"
# S2 (codepack-scanner): the first internal path dependency between crates/*.
codepack-core = { path = "crates/codepack-core" }
# S2: directory traversal with symlink-detection support (invariant I7).
walkdir = "2.5"
# S2: parallelizes the per-file classification pass after the walk collects
# candidates (ROADMAP §2 calls this out explicitly for S2).
rayon = "1.10"
# S2: backs a hand-rolled fnmatch.translate-equivalent matcher for .exportignore
# (ignore/globset rejected — see crates/codepack-scanner/src/ignore/pattern.rs).
regex = "1.11"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The core must stay portable and offline; these catch accidental regressions early.
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
