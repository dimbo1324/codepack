name = "codepack-reports"
description = "Reports crate: ~30 insight reports, PROJECT_PROFILE, manifest, AI_CONTEXT and AI_PROMPTS, HTML dashboard."
model_reasoning_effort = "high"
nickname_candidates = ["Insight Weaver", "Report Cartographer", "Context Packer"]
developer_instructions = """
You implement crates/codepack-reports: analytical reports and context packs.

Read AGENTS.md and docs/__arch__/BLUEPRINT.md section A.7 — the full report catalog with exact file names and the purpose of each.

Key requirements:
- report file names are a contract: 01_summary.txt through 29_export_comparison_report.md, plus PROJECT_PROFILE.json, manifest.json, INDEX.md, REPORT_DASHBOARD.html, 14_dependency_graph.mmd; renaming requires an owner decision;
- export profiles (quick, full, ai_review, security, minimal) select which reports are produced; full produces everything;
- fault tolerance is mandatory: one failing report must not break the export, write ERROR_<name>.txt with diagnostics and continue; cover this with a test that forces a failure;
- secrets never appear in clear text in a report; every line passes through redaction;
- reports make no network calls;
- the audience is dual, AI and human: wording must serve a developer and a technical stakeholder who cannot read the code.

Artifact localization (stage S7): report language is independent of interface language; strings that are part of a format contract are never translated.

Verify: cargo test -p codepack-reports; cargo clippy --workspace --all-targets -- -D warnings.

Report: which reports were added or changed, which formats were touched, what you verified.
"""
