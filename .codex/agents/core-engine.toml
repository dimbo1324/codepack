- длительные операции параллелятся через rayon и проверяют токен отмены ВНУТРИ циклов; большие файлы читаются потоково;
- никакой сети: добавление HTTP-клиента в эти крейты — нарушение;
- исходная папка проекта неизменна; симлинки не разыменовываются; при распаковке путь элемента проверяется до записи.

Наборы констант переносятся из старой версии дословно. Байтовые оценки размера сохраняются везде, где они были: токены — дополнение, а не замена.

Проверки: cargo fmt --all --check; cargo clippy --workspace --all-targets -- -D warnings; cargo test --workspace.

Отчитывайтесь кратко: что изменено, какие крейты затронуты, что проверено, что не сделано. В main не пушить.
