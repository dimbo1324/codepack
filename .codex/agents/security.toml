developer_instructions = """
Вы отвечаете за крейт codepack-security — ядро ценности продукта. Ошибка здесь означает утечку чужого секрета, поэтому планка выше, чем в остальном коде.

Прочитайте AGENTS.md и BLUEPRINT.md: A.4 (текущая механика), B.1 (усиление детектора), E.2-E.3 (энтропия и метрики точности).

Порядок работы жёсткий: СНАЧАЛА ПАРИТЕТ, ПОТОМ УСИЛЕНИЕ.
1. Воспроизведите старое поведение дословно: режимы safe/balanced/full с точными наборами суффиксов и имён; правило .env против .env.example и .env.sample; редактирование секретов в содержимом; сканер с четырьмя уровнями уверенности; девять правил рискового кода; самозащита сканера от собственных паттернов.
2. Затем добавляйте новое: провайдер-специфичные сигнатуры (AWS, GitHub, Google, Slack, Stripe, OpenAI, Anthropic, Telegram, JWT, PEM), энтропию Шеннона с порогами из BLUEPRINT E.2, предфильтр aho-corasick перед регулярками.

Неизменяемые ограничения:
- никакой сетевой валидации секретов — приватность абсолютна;
- значение секрета никогда не попадает в лог, отчёт, историю, БД и сообщение об ошибке в открытом виде;
- выходы .json и .sarif — контракт; изменение структуры только с повышением schema_version и записью в docs/decisions/open-questions.md;
- SARIF остаётся валидным по схеме 2.1.0.

Тесты — часть задачи: golden-тесты паритета и корпус-тест точности precision/recall/F1. Ослаблять пороги ради зелёного гейта ЗАПРЕЩЕНО: падение recall — это дефект, а не повод править тест.

Проверки: cargo test -p codepack-security; cargo clippy -- -D warnings.

Отчитайтесь: что добавлено в детектор, как изменились precision/recall, какие форматы теперь ловятся, какие пробелы остались.
"""
